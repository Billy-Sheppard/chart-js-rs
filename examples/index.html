<html>

<head>
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />

  <title>chart-js-rs Example</title>

  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-startup-image" type="image/png" href="./favicon.png">

  <link rel="stylesheet" href="./index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@^2/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@^1/dist/chartjs-adapter-luxon.umd.min.js"></script>

  <script>
    (async () => {
      if (self.crossOriginIsolated) return;
      if (!('serviceWorker' in navigator)) return;
      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      location.reload();
    })();
  </script>
</head>

<body>
</body>
<script type="module">
  globalThis.app_js_path = "chart_js_rs_example.js";

  import init, * as root from './chart_js_rs_example.js'
  window.callbacks = root;
  await init();

  window.mutate_chart_object = function (v) {
    if (v.id == "bar") {
      v.options.scales.y1.ticks = {
        callback:
          function (value, _index, _values) {
            return '$' + value.toFixed(2);
          }
      };
    }

    return v
  };
</script>

</html>
