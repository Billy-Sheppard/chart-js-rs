[package]
name = "chart-js-rs"
version = "0.1.8"
edition = "2021"
authors = ["Billy Sheppard", "Luis Moreno"]
license = "Apache-2.0"
keywords = ["javascript", "dom", "wasm", "charts"]
categories = ["gui", "web-programming", "wasm"]
readme = "README.md"
description = "Chart JS API for Rust WebAssembly"
repository = "https://github.com/Billy-Sheppard/chart-js-rs"
homepage = "https://github.com/Billy-Sheppard/chart-js-rs"

[dependencies]
gloo-console = { version = "0.4.0" }
gloo-utils = { version = "0.3.0", features = ["serde"] }
js-sys = "0.3.99"
rust_decimal = "1.42.0"
serde = { version = "1.0.228", features = ["derive"] }
erased-serde = { version = "0.4.10" }
serde_json = "1.0.150"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.122", features = ["serde-serialize"] }
uuid = { version = "1.23.2", features = ["v4", "js"] }
web-sys = { version = "0.3.99", optional = true, features = [
    "DomRect",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "WorkerOptions",
    "WorkerType",
] }
tokio = { version = "1.52.3", features = ["sync"], optional = true }
itertools = "0.14.0"

[workspace]
members = ["examples"]

[build-dependencies]
heck = "0.5.0"
itertools = "0.14.0"
quote = "1.0.45"
proc-macro2 = "1.0.106"
syn = { features = ["parsing", "full"], version = "2.0.117" }

[features]
default = []
workers = [
    "dep:web-sys",
    "dep:tokio",
    "web-sys/CssStyleDeclaration",
    "web-sys/Element",
    "web-sys/MouseEvent",
    "web-sys/Window",
]
