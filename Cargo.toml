[package]
name = "chart-js-rs"
version = "0.1.8"
edition = "2021"
authors = ["Billy Sheppard", "Luis Moreno"]
license = "Apache-2.0"
keywords = ["javascript", "dom", "wasm", "charts"]
categories = ["gui", "web-programming", "wasm"]
readme = "README.md"
description = "Chart JS API for Rust WebAssembly"
repository = "https://github.com/Billy-Sheppard/chart-js-rs"
homepage = "https://github.com/Billy-Sheppard/chart-js-rs"

[dependencies]
gloo-console = { version = "0.4.0" }
gloo-utils = { version = "0.3.0", features = ["serde"] }
js-sys = "0.3.103"
rust_decimal = "1.42.1"
serde = { version = "1.0.228", features = ["derive"] }
erased-serde = { version = "0.4.10" }
serde_json = "1.0.150"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
uuid = { version = "1.24.0", features = ["v4", "js"] }
web-sys = { version = "0.3.103", optional = true, features = [
    "DomRect",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "WorkerOptions",
    "WorkerType",
] }
worxide = { version = "0.0.6", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
itertools = "0.15.0"

[workspace]
members = ["examples"]

[build-dependencies]
heck = "0.5.0"
itertools = "0.15.0"
quote = "1.0.46"
proc-macro2 = "1.0.106"
syn = { features = ["parsing", "full"], version = "2.0.119" }

[features]
default = []
workers = [
    "dep:worxide",
    "dep:wasm-bindgen-futures",
    "web-sys/CssStyleDeclaration",
    "web-sys/DedicatedWorkerGlobalScope",
    "web-sys/Document",
    "web-sys/DomRect",
    "web-sys/Element",
    "web-sys/HtmlCanvasElement",
    "web-sys/HtmlElement",
    "web-sys/MouseEvent",
    "web-sys/MutationObserver",
    "web-sys/MutationObserverInit",
    "web-sys/Node",
    "web-sys/NodeList",
    "web-sys/OffscreenCanvas",
    "web-sys/ResizeObserver",
    "web-sys/Window",
]